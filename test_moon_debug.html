<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Moon - АстроКомпас</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0e12;
            color: #e8e6ed;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .test-box {
            background: #1a1625;
            border: 1px solid rgba(182,157,232,0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h2 { color: #b69de8; font-size: 1rem; margin-top: 20px; margin-bottom: 10px; }
        button {
            width: 100%;
            padding: 12px;
            background: #b69de8;
            color: #140a1e;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
        }
        button:hover { background: #c9b4f2; }
        .debug-log {
            background: #241a30;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            overflow-x: auto;
            margin-bottom: 12px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(182,157,232,0.2);
        }
        .moon-viz {
            text-align: center;
            margin: 20px 0;
        }
        svg {
            max-width: 200px;
        }
    </style>
</head>
<body>
    <div class="test-box">
        <h2>🌙 Moon Visualization Debug</h2>
        <button onclick="testMoon()">Test Current Moon</button>
        <button onclick="testFullMoon()">Test Full Moon (180°)</button>
        <button onclick="testHalfMoon()">Test Half Moon (90°)</button>
        <button onclick="testNewMoon()">Test New Moon (0°)</button>
    </div>

    <div class="test-box">
        <div class="moon-viz">
            <div class="moon-illustration" id="moon-illustration"></div>
            <p id="moon-data"></p>
        </div>
    </div>

    <div class="test-box">
        <h2>Debug Log:</h2>
        <div class="debug-log" id="debug-log"></div>
    </div>

    <script src="js/astro-core.js"></script>
    <script>
        const log = (msg) => {
            console.log(msg);
            const el = document.getElementById('debug-log');
            el.innerHTML += msg + '<br>';
            el.scrollTop = el.scrollHeight;
        };

        function moonIllustrationSVG(phaseAngleDeg) {
            var phase = (phaseAngleDeg % 360) / 360;
            var cx = 100, cy = 100, r = 74;
            var illum = (1 - Math.cos(phaseAngleDeg * Math.PI / 180)) / 2;

            log(`[SVG] angle=${phaseAngleDeg.toFixed(1)}° illum=${illum.toFixed(3)}`);

            var clipX = cx + r - 2 * r * illum;
            var clipId = 'mclip' + Math.round(Math.random() * 10000);

            log(`[SVG] clipX=${clipX.toFixed(1)} (formula: 100 + 74 - 2*74*${illum.toFixed(3)})`);

            return '<svg viewBox="0 0 200 200" width="140" height="140" style="filter:drop-shadow(0 0 28px rgba(182,157,232,0.45))">' +
              '<defs>' +
              '<radialGradient id="mglow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#B69DE8" stop-opacity="0.3"/><stop offset="65%" stop-color="#B69DE8" stop-opacity="0.08"/><stop offset="100%" stop-color="#B69DE8" stop-opacity="0"/></radialGradient>' +
              '<radialGradient id="mlit" cx="65%" cy="35%" r="60%"><stop offset="0%" stop-color="#F5F0DC"/><stop offset="55%" stop-color="#C4C0A4"/><stop offset="100%" stop-color="#88846C"/></radialGradient>' +
              '<clipPath id="' + clipId + '"><circle cx="100" cy="100" r="74"/><rect x="' + clipX + '" y="0" width="200" height="200"/></clipPath>' +
              '</defs>' +
              '<circle cx="100" cy="100" r="96" fill="url(#mglow)"/>' +
              '<circle cx="100" cy="100" r="74" fill="#241A30"/>' +
              '<circle cx="100" cy="100" r="74" fill="url(#mlit)" clip-path="url(#' + clipId + ')"/>' +
              '<g opacity="0.18"><circle cx="128" cy="72" r="8" fill="#908A70"/><circle cx="140" cy="110" r="5" fill="#908A70"/><circle cx="118" cy="132" r="10" fill="#908A70"/><circle cx="133" cy="89" r="4" fill="#908A70"/></g>' +
              '<circle cx="100" cy="100" r="74" fill="none" stroke="rgba(182,157,232,0.25)" stroke-width="1"/>' +
              '</svg>';
        }

        function testMoon() {
            log('=== Testing CURRENT moon phase ===');
            const now = new Date();
            const year = now.getUTCFullYear();
            const month = now.getUTCMonth() + 1;
            const day = now.getUTCDate();
            const hours = now.getUTCHours();
            const minutes = now.getUTCMinutes();

            log(`UTC Time: ${year}-${month}-${day} ${hours}:${minutes}`);

            const jd = AstroCore.julianDay(year, month, day, hours, minutes, 0);
            const T = AstroCore.centuriesSinceJ2000(jd);

            const sun = AstroCore.planetLongitude('sun', T);
            const moon = AstroCore.planetLongitude('moon', T);

            log(`Sun longitude: ${sun.lon.toFixed(2)}°`);
            log(`Moon longitude: ${moon.lon.toFixed(2)}°`);

            const phase = AstroCore.moonPhase(sun.lon, moon.lon);
            log(`Moon phase angle: ${phase.angle.toFixed(1)}°`);
            log(`Moon illumination: ${(phase.illumination * 100).toFixed(1)}%`);
            log(`Moon phase name: ${phase.name}`);

            document.getElementById('moon-illustration').innerHTML = moonIllustrationSVG(phase.angle);
            document.getElementById('moon-data').textContent = `${(phase.illumination * 100).toFixed(1)}% - ${phase.name}`;
        }

        function testFullMoon() {
            log('=== Testing FULL MOON (180°) ===');
            document.getElementById('moon-illustration').innerHTML = moonIllustrationSVG(180);
            document.getElementById('moon-data').textContent = '100% - Full Moon';
        }

        function testHalfMoon() {
            log('=== Testing HALF MOON (90°) ===');
            document.getElementById('moon-illustration').innerHTML = moonIllustrationSVG(90);
            document.getElementById('moon-data').textContent = '50% - Half Moon';
        }

        function testNewMoon() {
            log('=== Testing NEW MOON (0°) ===');
            document.getElementById('moon-illustration').innerHTML = moonIllustrationSVG(0);
            document.getElementById('moon-data').textContent = '0% - New Moon';
        }

        // Test on load
        window.addEventListener('load', () => {
            log('Page loaded. Testing current moon...');
            testMoon();
        });
    </script>
</body>
</html>
