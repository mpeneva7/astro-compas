<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Пълно слънчево затъмнение">
  <defs>
    <radialGradient id="sky" cx="50%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#1a1d40"/>
      <stop offset="48%" stop-color="#111330"/>
      <stop offset="100%" stop-color="#07080f"/>
    </radialGradient>

    <!-- корона: мек златист ореол -->
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="30%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffe6a3" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#f5c451" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>

    <!-- вътрешно сияние около пръстена -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ffd27a" stop-opacity="0"/>
      <stop offset="82%" stop-color="#ffe6a3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7e0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>

    <!-- фина мъгла/nebula -->
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2f66" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2a2f66" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- фон -->
  <rect width="1200" height="630" fill="url(#sky)"/>
  <ellipse cx="600" cy="315" rx="520" ry="360" fill="url(#haze)"/>

  <!-- ситни фонови звезди с нежно трептене -->
  <g fill="#dfe3ff">
    <circle cx="120" cy="90" r="1.1" opacity=".5">
      <animate attributeName="opacity" values=".2;.7;.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="180" r="0.8" opacity=".35"/>
    <circle cx="90" cy="300" r="1" opacity=".45">
      <animate attributeName="opacity" values=".25;.6;.25" dur="5.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="440" r="1.2" opacity=".5"/>
    <circle cx="320" cy="530" r="0.7" opacity=".3">
      <animate attributeName="opacity" values=".15;.5;.15" dur="6s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="110" r="1.1" opacity=".5">
      <animate attributeName="opacity" values=".2;.7;.2" dur="5s" begin=".5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="250" r="0.8" opacity=".4"/>
    <circle cx="1120" cy="380" r="1" opacity=".45">
      <animate attributeName="opacity" values=".25;.6;.25" dur="4.8s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="500" r="0.9" opacity=".4"/>
    <circle cx="1060" cy="540" r="1.2" opacity=".5">
      <animate attributeName="opacity" values=".2;.65;.2" dur="5.2s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="80" r="0.8" opacity=".35"/>
    <circle cx="760" cy="90" r="1" opacity=".45">
      <animate attributeName="opacity" values=".25;.6;.25" dur="5.8s" begin=".8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="560" r="0.9" opacity=".4"/>
    <circle cx="850" cy="540" r="0.7" opacity=".3"/>
  </g>

  <!-- ==== затъмнение ==== -->
  <g transform="translate(600,315)">

    <!-- най-външно дишащо сияние (много бавно, нежно) -->
    <circle r="230" fill="url(#corona)" opacity="0.85">
      <animate attributeName="opacity" values="0.7;0.95;0.7" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.04;1" dur="8s" repeatCount="indefinite" additive="sum"/>
    </circle>

    <!-- средна корона -->
    <circle r="185" fill="url(#corona)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="6.5s" repeatCount="indefinite"/>
    </circle>

    <!-- лъчи на короната — бавно въртене + леко пулсиране на плътността -->
    <g opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="140s" repeatCount="indefinite"/>
      <g stroke="#ffe6a3" stroke-width="1.2" stroke-linecap="round">
        <line x1="0" y1="-112" x2="0" y2="-172"/>
        <line x1="38" y1="-105" x2="58" y2="-160"/>
        <line x1="72" y1="-86" x2="110" y2="-132"/>
        <line x1="99" y1="-57" x2="151" y2="-87"/>
        <line x1="112" y1="0" x2="172" y2="0"/>
        <line x1="99" y1="57" x2="151" y2="87"/>
        <line x1="72" y1="86" x2="110" y2="132"/>
        <line x1="38" y1="105" x2="58" y2="160"/>
        <line x1="0" y1="112" x2="0" y2="172"/>
        <line x1="-38" y1="105" x2="-58" y2="160"/>
        <line x1="-72" y1="86" x2="-110" y2="132"/>
        <line x1="-99" y1="57" x2="-151" y2="87"/>
        <line x1="-112" y1="0" x2="-172" y2="0"/>
        <line x1="-99" y1="-57" x2="-151" y2="-87"/>
        <line x1="-72" y1="-86" x2="-110" y2="-132"/>
        <line x1="-38" y1="-105" x2="-58" y2="-160"/>
      </g>
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- второ ниво лъчи, въртящи се в обратна посока, по-фини -->
    <g opacity="0.22" stroke="#fff3d6" stroke-width="0.8" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="200s" repeatCount="indefinite"/>
      <line x1="19" y1="-110" x2="30" y2="-150"/>
      <line x1="55" y1="-96" x2="84" y2="-128"/>
      <line x1="88" y1="-70" x2="132" y2="-100"/>
      <line x1="108" y1="-30" x2="160" y2="-44"/>
      <line x1="108" y1="30" x2="160" y2="44"/>
      <line x1="88" y1="70" x2="132" y2="100"/>
      <line x1="55" y1="96" x2="84" y2="128"/>
      <line x1="19" y1="110" x2="30" y2="150"/>
      <line x1="-19" y1="110" x2="-30" y2="150"/>
      <line x1="-55" y1="96" x2="-84" y2="128"/>
      <line x1="-88" y1="70" x2="-132" y2="100"/>
      <line x1="-108" y1="30" x2="-160" y2="44"/>
      <line x1="-108" y1="-30" x2="-160" y2="-44"/>
      <line x1="-88" y1="-70" x2="-132" y2="-100"/>
      <line x1="-55" y1="-96" x2="-84" y2="-128"/>
      <line x1="-19" y1="-110" x2="-30" y2="-150"/>
    </g>

    <!-- сияние точно около пръстена (нежно пулсиращо) -->
    <circle r="122" fill="url(#innerGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="120;126;120" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- светъл слънчев пръстен -->
    <circle r="100" fill="none" stroke="#ffd27a" stroke-width="4.5" opacity="0.92"/>
    <!-- тъмен лунен диск -->
    <circle r="98" fill="#080910"/>

    <!-- диамантен пръстен — нежно пулсиращ блясък, бавно обхожда ръба -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
      <g transform="translate(0,-100)">
        <circle r="24" fill="url(#starGlow)">
          <animate attributeName="opacity" values="0.75;1;0.75" dur="3.5s" repeatCount="indefinite"/>
          <animate attributeName="r" values="22;27;22" dur="3.5s" repeatCount="indefinite"/>
        </circle>
        <g stroke="#ffe6a3" stroke-linecap="round">
          <line x1="-28" y1="0" x2="28" y2="0" stroke-width="1.5">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
          </line>
          <line x1="0" y1="-28" x2="0" y2="28" stroke-width="1.5">
            <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
          </line>
          <line x1="-15" y1="-15" x2="15" y2="15" stroke-width="0.8" opacity="0.5"/>
          <line x1="-15" y1="15" x2="15" y2="-15" stroke-width="0.8" opacity="0.5"/>
        </g>
        <circle r="4.5" fill="#fff7e0"/>
      </g>
    </g>

  </g>
</svg>
