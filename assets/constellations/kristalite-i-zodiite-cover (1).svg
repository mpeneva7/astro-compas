<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Кристалите и зодиакалните знаци" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="sky" cx="50%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#1a1d40"/>
      <stop offset="48%" stop-color="#111330"/>
      <stop offset="100%" stop-color="#07080f"/>
    </radialGradient>

    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2f66" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2a2f66" stop-opacity="0"/>
    </radialGradient>

    <!-- сияние около централния кристал -->
    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="20%" stop-color="#cbb3ff" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#8f7ad6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8f7ad6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7e0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>

    <!-- фасети на кристала -->
    <linearGradient id="facetL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9c8ff"/>
      <stop offset="100%" stop-color="#7d63c4"/>
    </linearGradient>
    <linearGradient id="facetR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a98fe0"/>
      <stop offset="100%" stop-color="#5b4699"/>
    </linearGradient>
    <linearGradient id="facetTip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe6ff"/>
      <stop offset="100%" stop-color="#b4a0e6"/>
    </linearGradient>
  </defs>

  <!-- фон -->
  <rect width="1200" height="630" fill="url(#sky)"/>
  <ellipse cx="600" cy="315" rx="520" ry="360" fill="url(#haze)"/>

  <!-- ситни фонови звезди с нежно трептене -->
  <g fill="#dfe3ff">
    <circle cx="120" cy="90" r="1.1" opacity=".5">
      <animate attributeName="opacity" values=".2;.7;.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="180" r="0.8" opacity=".35"/>
    <circle cx="90" cy="300" r="1" opacity=".45">
      <animate attributeName="opacity" values=".25;.6;.25" dur="5.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="440" r="1.2" opacity=".5"/>
    <circle cx="320" cy="530" r="0.7" opacity=".3">
      <animate attributeName="opacity" values=".15;.5;.15" dur="6s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="110" r="1.1" opacity=".5">
      <animate attributeName="opacity" values=".2;.7;.2" dur="5s" begin=".5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="250" r="0.8" opacity=".4"/>
    <circle cx="1120" cy="380" r="1" opacity=".45">
      <animate attributeName="opacity" values=".25;.6;.25" dur="4.8s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="500" r="0.9" opacity=".4"/>
    <circle cx="1060" cy="540" r="1.2" opacity=".5">
      <animate attributeName="opacity" values=".2;.65;.2" dur="5.2s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="80" r="0.8" opacity=".35"/>
    <circle cx="760" cy="90" r="1" opacity=".45">
      <animate attributeName="opacity" values=".25;.6;.25" dur="5.8s" begin=".8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="560" r="0.9" opacity=".4"/>
    <circle cx="850" cy="540" r="0.7" opacity=".3"/>
  </g>

  <!-- ==== централен кристал + обикаляща звезда ==== -->
  <g transform="translate(600,315)">

    <!-- дишащо сияние около кристала -->
    <circle r="180" fill="url(#crystalGlow)" opacity="0.85">
      <animate attributeName="opacity" values="0.65;0.95;0.65" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="8s" repeatCount="indefinite" additive="sum"/>
    </circle>

    <!-- зодиакален пръстен от 12 фини точки, бавно въртящ се -->
    <g opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="160s" repeatCount="indefinite"/>
      <g fill="#f5c451">
        <circle cx="0" cy="-150" r="2.4"/>
        <circle cx="75" cy="-130" r="2.4"/>
        <circle cx="130" cy="-75" r="2.4"/>
        <circle cx="150" cy="0" r="2.4"/>
        <circle cx="130" cy="75" r="2.4"/>
        <circle cx="75" cy="130" r="2.4"/>
        <circle cx="0" cy="150" r="2.4"/>
        <circle cx="-75" cy="130" r="2.4"/>
        <circle cx="-130" cy="75" r="2.4"/>
        <circle cx="-150" cy="0" r="2.4"/>
        <circle cx="-130" cy="-75" r="2.4"/>
        <circle cx="-75" cy="-130" r="2.4"/>
      </g>
      <circle r="150" fill="none" stroke="#f5c451" stroke-width="0.6" opacity="0.35"/>
    </g>

    <!-- централен кристал (изправен, многофасетен) -->
    <g>
      <animate attributeName="opacity" values="0.92;1;0.92" dur="6s" repeatCount="indefinite"/>
      <!-- ляво тяло + лява фасета на върха -->
      <polygon points="-34,40 -34,-28 0,-72 0,70" fill="url(#facetL)" opacity="0.95"/>
      <!-- дясно тяло + дясна фасета на върха -->
      <polygon points="0,-72 34,-28 34,40 0,70" fill="url(#facetR)" opacity="0.95"/>
      <!-- връх: лява светла фасета -->
      <polygon points="-34,-28 0,-72 0,-14" fill="url(#facetTip)" opacity="0.92"/>
      <!-- връх: дясна фасета -->
      <polygon points="0,-72 34,-28 0,-14" fill="#c9b6f2" opacity="0.7"/>
      <!-- вертикална ръбова линия -->
      <line x1="0" y1="-72" x2="0" y2="70" stroke="#efe6ff" stroke-width="1" opacity="0.5"/>
      <line x1="-34" y1="-28" x2="-34" y2="40" stroke="#efe6ff" stroke-width="0.7" opacity="0.35"/>
      <line x1="34" y1="-28" x2="34" y2="40" stroke="#efe6ff" stroke-width="0.7" opacity="0.35"/>
      <!-- блик -->
      <polygon points="-18,-18 -6,-46 -3,-14 -13,12" fill="#ffffff" opacity="0.28"/>
    </g>

    <!-- обикаляща звезда с цветна следа по зодиакалния пръстен -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      <g transform="translate(0,-150)">
        <!-- следа -->
        <circle cx="7" cy="0" r="2.6" opacity="0.18">
          <animate attributeName="fill" values="#ff6b5a;#ffd36b;#8fd66b;#6bd6cf;#6b9bd6;#b98fe0;#ff6b5a" dur="24s" repeatCount="indefinite"/>
        </circle>
        <circle cx="13" cy="0" r="2.0" opacity="0.12">
          <animate attributeName="fill" values="#ff6b5a;#ffd36b;#8fd66b;#6bd6cf;#6b9bd6;#b98fe0;#ff6b5a" dur="24s" repeatCount="indefinite"/>
        </circle>
        <circle cx="19" cy="0" r="1.4" opacity="0.07">
          <animate attributeName="fill" values="#ff6b5a;#ffd36b;#8fd66b;#6bd6cf;#6b9bd6;#b98fe0;#ff6b5a" dur="24s" repeatCount="indefinite"/>
        </circle>
        <!-- меко цветно сияние -->
        <circle r="11" opacity="0.55" fill="url(#starGlow)"/>
        <!-- ядро -->
        <circle r="3.6" fill="#fff"/>
        <path d="M0,-9 L1.8,-1.8 L9,0 L1.8,1.8 L0,9 L-1.8,1.8 L-9,0 L-1.8,-1.8 Z">
          <animate attributeName="fill" values="#ffe0d6;#fff2cf;#e6f5cf;#cff2ef;#cfe0f5;#eadcff;#ffe0d6" dur="24s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

  </g>
</svg>
