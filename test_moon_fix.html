<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Moon Fix - АстроКомпас</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0e12;
            color: #e8e6ed;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .test-box {
            background: #1a1625;
            border: 1px solid rgba(182,157,232,0.2);
            border-radius: 12px;
            padding: 20px;
        }
        h2 { color: #b69de8; font-size: 1rem; margin-top: 0; margin-bottom: 15px; }
        button {
            width: 100%;
            padding: 12px;
            background: #b69de8;
            color: #140a1e;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        button:hover { background: #c9b4f2; }
        button:active { opacity: 0.8; }
        .moon-viz {
            text-align: center;
            margin: 15px 0;
            padding: 20px;
            background: rgba(182,157,232,0.05);
            border-radius: 8px;
        }
        .moon-data {
            font-size: 0.9rem;
            color: #b69de8;
            font-weight: 600;
            margin: 10px 0;
        }
        .debug-log {
            background: #241a30;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            overflow: auto;
            max-height: 250px;
            border: 1px solid rgba(182,157,232,0.2);
            font-family: 'Courier New', monospace;
            line-height: 1.4;
        }
        .log-entry {
            margin: 2px 0;
            padding: 2px 4px;
        }
        .log-entry.info { color: #b69de8; }
        .log-entry.success { color: #4caf50; }
        .log-entry.error { color: #ef5350; }
        .status {
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        .status.success { background: rgba(76,175,80,0.1); color: #4caf50; }
        .status.error { background: rgba(239,83,80,0.1); color: #ef5350; }
        .illum-bar {
            width: 100%;
            height: 8px;
            background: rgba(74,63,84,0.5);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .illum-fill {
            height: 100%;
            background: #b69de8;
            transition: width 0.3s ease;
            border-radius: 4px;
        }
        .test-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .test-row button {
            flex: 1;
            margin: 0;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #b69de8; margin-bottom: 30px;">🌙 Moon Visualization Test Suite</h1>

    <div class="container">
        <!-- Test Controls -->
        <div class="test-box">
            <h2>Test Controls</h2>

            <div class="test-row">
                <button onclick="testCurrentMoon()">Current Moon</button>
                <button onclick="clearLog()">Clear Log</button>
            </div>

            <div class="test-row">
                <button onclick="testNewMoon()">New Moon</button>
                <button onclick="testHalfMoon()">Half Moon</button>
                <button onclick="testFullMoon()">Full Moon</button>
            </div>

            <div class="test-row">
                <button onclick="testWaxingCrescent()">Waxing 25%</button>
                <button onclick="testWaningCrescent()">Waning 25%</button>
            </div>

            <button onclick="startAutoUpdate()">Start Auto Update (10s)</button>
            <button onclick="stopAutoUpdate()">Stop Auto Update</button>

            <h2 style="margin-top: 20px;">Test Results</h2>
            <div id="status"></div>
        </div>

        <!-- Visualization -->
        <div class="test-box">
            <h2>Moon Visualization</h2>
            <div class="moon-viz" id="vizContainer">
                <div id="moon-illustration" style="display: flex; justify-content: center;"></div>
                <div class="moon-data" id="moon-data">Waiting for test...</div>
                <div class="illum-bar">
                    <div class="illum-fill" id="moon-illum-fill" style="width: 0%"></div>
                </div>
                <div class="moon-data" style="font-size: 0.85rem; color: #888;">Phase: <span id="phase-name">-</span></div>
            </div>
        </div>
    </div>

    <!-- Debug Log -->
    <div class="test-box">
        <h2>Debug Log</h2>
        <div class="debug-log" id="debug-log"></div>
    </div>

    <script src="js/astro-core.js"></script>
    <script>
        let autoUpdateInterval = null;
        const logs = [];

        const log = (msg, type = 'info') => {
            const timestamp = new Date().toLocaleTimeString();
            const logMsg = `[${timestamp}] ${msg}`;
            logs.push(logMsg);
            console.log(logMsg);

            const logEl = document.getElementById('debug-log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = logMsg;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        };

        const clearLog = () => {
            document.getElementById('debug-log').innerHTML = '';
            logs.length = 0;
        };

        function moonIllustrationSVG(phaseAngleDeg) {
            var phase = (phaseAngleDeg % 360) / 360;
            var illum = (1 - Math.cos(phaseAngleDeg * Math.PI / 180)) / 2;
            var cx = 100, cy = 100, r = 74;
            var theta = phase * 2 * Math.PI;
            var rx = Math.abs(r * Math.cos(theta));
            var sweepOuter, sweepInner;
            if (phase < 0.5) { sweepOuter = 1; sweepInner = (phase < 0.25) ? 1 : 0; }
            else { sweepOuter = 0; sweepInner = (phase < 0.75) ? 1 : 0; }
            var top = cx + ',' + (cy - r), bottom = cx + ',' + (cy + r);
            var litPath = 'M ' + top + ' A ' + r + ',' + r + ' 0 0 ' + sweepOuter + ' ' + bottom +
              ' A ' + rx + ',' + r + ' 0 0 ' + sweepInner + ' ' + top + ' Z';

            var uid = Math.round(Math.random() * 100000);
            var glowId = 'mglow' + uid;
            var litId = 'mlit' + uid;

            log(`SVG: angle=${phaseAngleDeg.toFixed(1)}° illum=${illum.toFixed(3)} rx=${rx.toFixed(1)} uid=${uid}`, 'info');

            return '<svg viewBox="0 0 200 200" width="140" height="140" style="filter:drop-shadow(0 0 28px rgba(182,157,232,0.45))">' +
              '<defs>' +
              '<radialGradient id="' + glowId + '" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#B69DE8" stop-opacity="0.3"/><stop offset="65%" stop-color="#B69DE8" stop-opacity="0.08"/><stop offset="100%" stop-color="#B69DE8" stop-opacity="0"/></radialGradient>' +
              '<radialGradient id="' + litId + '" cx="65%" cy="35%" r="60%"><stop offset="0%" stop-color="#F5F0DC"/><stop offset="55%" stop-color="#C4C0A4"/><stop offset="100%" stop-color="#88846C"/></radialGradient>' +
              '</defs>' +
              '<circle cx="100" cy="100" r="96" fill="url(#' + glowId + ')"/>' +
              '<circle cx="100" cy="100" r="74" fill="#241A30"/>' +
              '<path d="' + litPath + '" fill="url(#' + litId + ')"/>' +
              '<g opacity="0.18"><circle cx="128" cy="72" r="8" fill="#908A70"/><circle cx="140" cy="110" r="5" fill="#908A70"/><circle cx="118" cy="132" r="10" fill="#908A70"/><circle cx="133" cy="89" r="4" fill="#908A70"/></g>' +
              '<circle cx="100" cy="100" r="74" fill="none" stroke="rgba(182,157,232,0.25)" stroke-width="1"/>' +
              '</svg>';
        }

        function renderMoon(angle, name) {
            var illum = (1 - Math.cos(angle * Math.PI / 180)) / 2;
            var percentIllum = Math.round(illum * 100);

            log(`🌙 Rendering: angle=${angle.toFixed(1)}° illum=${percentIllum}% (${name})`, 'success');

            var moonEl = document.getElementById('moon-illustration');
            moonEl.innerHTML = '';
            moonEl.dataset.updateTime = Date.now();
            moonEl.innerHTML = moonIllustrationSVG(angle);
            moonEl.offsetHeight; // Force repaint

            document.getElementById('moon-illum-fill').style.width = percentIllum + '%';
            document.getElementById('moon-data').textContent = `${percentIllum}% осветена`;
            document.getElementById('phase-name').textContent = name;

            const status = document.getElementById('status');
            status.innerHTML = `<div class="status success">✅ Moon rendered: ${name}</div>`;
        }

        function testNewMoon() { renderMoon(0, 'New Moon'); }
        function testWaxingCrescent() { renderMoon(45, 'Waxing Crescent (25%)'); }
        function testHalfMoon() { renderMoon(90, 'First Quarter (50%)'); }
        function testFullMoon() { renderMoon(180, 'Full Moon (100%)'); }
        function testWaningCrescent() { renderMoon(315, 'Waning Crescent (25%)'); }

        function testCurrentMoon() {
            log('=== Testing CURRENT Moon Phase ===', 'info');

            const now = new Date();
            const year = now.getUTCFullYear();
            const month = now.getUTCMonth() + 1;
            const day = now.getUTCDate();
            const hours = now.getUTCHours();
            const minutes = now.getUTCMinutes();

            log(`UTC: ${year}-${month}-${day} ${hours}:${minutes}:00`);

            const jd = AstroCore.julianDay(year, month, day, hours, minutes, 0);
            const T = AstroCore.centuriesSinceJ2000(jd);

            const sun = AstroCore.planetLongitude('sun', T);
            const moon = AstroCore.planetLongitude('moon', T);

            log(`☀️  Sun: ${sun.lon.toFixed(2)}°`);
            log(`🌙 Moon: ${moon.lon.toFixed(2)}°`);

            const phase = AstroCore.moonPhase(sun.lon, moon.lon);
            log(`Angle: ${phase.angle.toFixed(1)}° (${phase.name})`);

            renderMoon(phase.angle, phase.name);
        }

        function startAutoUpdate() {
            if (autoUpdateInterval) {
                log('Auto update already running', 'error');
                return;
            }
            log('Starting auto update (every 10 seconds)', 'info');
            testCurrentMoon();
            autoUpdateInterval = setInterval(testCurrentMoon, 10000);
        }

        function stopAutoUpdate() {
            if (autoUpdateInterval) {
                clearInterval(autoUpdateInterval);
                autoUpdateInterval = null;
                log('Auto update stopped', 'success');
            }
        }

        // Initial test
        window.addEventListener('load', () => {
            log('🌙 Moon Visualization Test Suite Loaded');
            log('Ready for testing. Click "Current Moon" to start.');
        });
    </script>
</body>
</html>
